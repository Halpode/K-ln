<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Köln 08.–10.05.2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', sans-serif;
    }

    /* ── Full-screen map ── */
    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── Leaflet attribution dark ── */
    .leaflet-control-attribution {
      background: rgba(0,0,0,.65) !important;
      color: #555 !important;
      font-size: .65rem !important;
    }
    .leaflet-control-attribution a { color: #666 !important; }
    .leaflet-control-zoom a {
      background: #111 !important;
      color: #fff !important;
      border-color: #333 !important;
    }
    .leaflet-control-zoom a:hover { background: #222 !important; }

    /* ── Custom pin ── */
    .map-pin {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: #0a0a0a;
      border: 2px solid #fff;
      border-radius: 0;
      font-size: 1.2rem;
      box-shadow: 0 0 0 1px #000, 4px 4px 0 rgba(255,255,255,.08);
      transition: border-color .15s, transform .15s;
      line-height: 1;
    }
    .map-pin:hover {
      border-color: #e00;
      transform: scale(1.1);
    }
    .map-pin.active {
      border-color: #e00;
      background: #1a0000;
    }

    /* ── Modal overlay ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Modal card – Pothead punk style ── */
    #modal-card {
      background: #0a0a0a;
      border: 2px solid #fff;
      border-radius: 0;
      box-shadow: 8px 8px 0 rgba(220,0,0,.35), 0 0 0 1px #000;
      max-width: 340px;
      width: 100%;
      padding: 0;
      transform: translateY(12px) scale(.97);
      transition: transform .22s cubic-bezier(.34,1.2,.64,1);
      position: relative;
      overflow: hidden;
    }
    #modal-overlay.open #modal-card {
      transform: translateY(0) scale(1);
    }

    /* red stripe at top */
    #modal-card::before {
      content: '';
      display: block;
      height: 4px;
      background: #e00;
    }

    #modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: 1px solid #333;
      color: #666;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      transition: border-color .15s, color .15s;
    }
    #modal-close:hover { border-color: #e00; color: #fff; }

    #modal-body {
      padding: 1.5rem 1.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    #modal-label {
      font-family: 'Oswald', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #fff;
      text-align: center;
      line-height: 1.2;
    }
    #modal-label .pin-emoji {
      display: block;
      font-size: 2rem;
      margin-bottom: .35rem;
    }

    #modal-qr {
      background: #fff;
      padding: .6rem;
      border: 2px solid #fff;
      box-shadow: 4px 4px 0 rgba(220,0,0,.2);
    }
    #modal-qr img {
      display: block;
      width: 180px;
      height: 180px;
    }

    #modal-hint {
      font-size: .72rem;
      color: #444;
      text-align: center;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- Full-screen map -->
<div id="map"></div>

<!-- QR Modal -->
<div id="modal-overlay">
  <div id="modal-card">
    <button id="modal-close" aria-label="Schließen">✕</button>
    <div id="modal-body">
      <div id="modal-label"><span id="modal-emoji" class="pin-emoji"></span><span id="modal-name"></span></div>
      <div id="modal-qr"><img id="modal-qr-img" src="" alt="QR Code" width="180" height="180" /></div>
      <div id="modal-hint">Scannen zum Öffnen</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  'use strict';

  /* ── Map ── */
  var map = L.map('map', {
    center: [50.9340, 6.9495],
    zoom: 13,
    zoomControl: true,
    scrollWheelZoom: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  /* ── Location data ── */
  var locations = [
    {
      lat: 50.9431, lng: 6.9591,
      emoji: '🚆',
      name: 'Köln Hauptbahnhof',
      url: 'https://www.google.com/maps/search/?api=1&query=K%C3%B6ln+Hauptbahnhof'
    },
    {
      lat: 50.9250, lng: 6.9530,
      emoji: '🏠',
      name: 'Airbnb',
      url: 'https://www.airbnb.de/rooms/5391364?adults=3&check_in=2026-05-08&check_out=2026-05-10&search_mode=regular_search&source_impression_id=p3_1772967829_P3S7Fhy1sKy-w9mB&previous_page_section_name=1000&federated_search_id=e9e9c140-ab87-4551-88ce-815df4cd55ca'
    },
    {
      lat: 50.9381, lng: 6.9388,
      emoji: '🛍️',
      name: 'Belgisches Viertel',
      url: 'https://www.google.com/maps/search/?api=1&query=Belgisches+Viertel+K%C3%B6ln'
    },
    {
      lat: 50.9441, lng: 6.9459,
      emoji: '🍺',
      name: 'Päffgen Friesenstraße',
      url: 'https://www.google.com/maps/search/?api=1&query=P%C3%A4ffgen+Friesenstra%C3%9Fe+K%C3%B6ln'
    },
    {
      lat: 50.9512, lng: 6.9196,
      emoji: '👗',
      name: 'Ehrenfeld – Venloer Str.',
      url: 'https://www.google.com/maps/search/?api=1&query=Venloer+Stra%C3%9Fe+Ehrenfeld+K%C3%B6ln'
    },
    {
      lat: 50.9249, lng: 6.9538,
      emoji: '🍖',
      name: 'trashxchic',
      url: 'https://www.instagram.com/trashxchic?igsh=anFoMTU1dzNna2oz'
    },
    {
      lat: 50.9389, lng: 6.9337,
      emoji: '🎸',
      name: 'Kantine Köln',
      url: 'https://www.kantine.de'
    },
    {
      lat: 50.9212, lng: 6.9503,
      emoji: '🌳',
      name: 'Volksgarten',
      url: 'https://www.google.com/maps/search/?api=1&query=Volksgarten+K%C3%B6ln'
    }
  ];

  /* ── Build markers ── */
  var activeMarkerEl = null;

  locations.forEach(function (loc) {
    var iconEl = document.createElement('div');
    iconEl.className = 'map-pin';
    iconEl.textContent = loc.emoji;
    iconEl.title = loc.name;

    var icon = L.divIcon({
      html: iconEl.outerHTML,
      className: '',
      iconSize: [40, 40],
      iconAnchor: [20, 20],
      popupAnchor: [0, -24]
    });

    var marker = L.marker([loc.lat, loc.lng], { icon: icon }).addTo(map);

    marker.on('click', function () {
      openModal(loc, marker.getElement());
    });
  });

  /* ── Modal ── */
  var overlay   = document.getElementById('modal-overlay');
  var emojiEl   = document.getElementById('modal-emoji');
  var nameEl    = document.getElementById('modal-name');
  var qrImg     = document.getElementById('modal-qr-img');

  function openModal(loc, markerEl) {
    if (activeMarkerEl) activeMarkerEl.querySelector('.map-pin').classList.remove('active');
    activeMarkerEl = markerEl;
    if (markerEl) markerEl.querySelector('.map-pin').classList.add('active');

    emojiEl.textContent = loc.emoji;
    nameEl.textContent  = loc.name;
    var encoded = encodeURIComponent(loc.url);
    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encoded + '&color=0a0a0a&bgcolor=ffffff&margin=6';
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
    if (activeMarkerEl) activeMarkerEl.querySelector('.map-pin').classList.remove('active');
    activeMarkerEl = null;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
})();
</script>
</body>
</html>
