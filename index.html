<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Köln 08.–10.05.2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Inter', sans-serif;
    }

    /* ── Full-screen map ── */
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Leaflet dark overrides ── */
    .leaflet-control-attribution {
      background: rgba(0,0,0,.65) !important;
      color: #555 !important;
      font-size: .65rem !important;
    }
    .leaflet-control-attribution a { color: #666 !important; }
    .leaflet-control-zoom a {
      background: #111 !important;
      color: #fff !important;
      border-color: #333 !important;
    }
    .leaflet-control-zoom a:hover { background: #222 !important; }

    /* ── Square punk map pins ── */
    .map-pin {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: #0a0a0a;
      border: 2px solid #fff;
      border-radius: 0;
      font-size: 1.2rem;
      box-shadow: 0 0 0 1px #000, 4px 4px 0 rgba(255,255,255,.08);
      transition: border-color .15s, transform .15s;
      line-height: 1;
    }
    .map-pin:hover  { border-color: #e00; transform: scale(1.1); }
    .map-pin.active { border-color: #e00; background: #1a0000; }

    /* ── Modal overlay ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(0,0,0,.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #modal-overlay.open { opacity: 1; pointer-events: all; }

    /* ── Modal card ── */
    #modal-card {
      position: relative;
      background: #0a0a0a;
      border: 2px solid #fff;
      border-radius: 0;
      box-shadow: 8px 8px 0 rgba(220,0,0,.35), 0 0 0 1px #000;
      max-width: 380px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(14px) scale(.97);
      transition: transform .22s cubic-bezier(.34,1.2,.64,1);
    }
    #modal-overlay.open #modal-card { transform: translateY(0) scale(1); }

    /* red top stripe */
    #modal-stripe { height: 4px; background: #e00; flex-shrink: 0; }

    /* ── Image section (fixed top) ── */
    #modal-img-wrap {
      position: relative;
      width: 100%;
      height: 170px;
      overflow: hidden;
      background: #111;
      flex-shrink: 0;
    }
    #modal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(15%) contrast(1.05);
    }
    /* gradient overlay at bottom of image */
    #modal-img-wrap::after {
      content: '';
      position: absolute;
      inset: auto 0 0 0;
      height: 60px;
      background: linear-gradient(transparent, #0a0a0a);
      pointer-events: none;
    }

    /* ── Close button overlaid on image ── */
    #modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      background: rgba(0,0,0,.72);
      border: 1px solid #444;
      color: #aaa;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: .95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      transition: border-color .15s, color .15s;
    }
    #modal-close:hover { border-color: #e00; color: #fff; }

    /* ── Scrollable body ── */
    #modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.1rem 1.3rem 1.5rem;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a #0a0a0a;
    }

    /* Name */
    #modal-label {
      font-family: 'Oswald', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #fff;
      line-height: 1.2;
      margin-bottom: .55rem;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    #modal-emoji { font-size: 1.35rem; }

    /* Description */
    #modal-desc {
      font-size: .83rem;
      color: #999;
      line-height: 1.6;
      margin-bottom: .85rem;
    }

    /* Highlights */
    #modal-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin-bottom: 1rem;
    }
    .hl-tag {
      background: #111;
      border: 1px solid #252525;
      color: #bbb;
      font-size: .71rem;
      padding: .2rem .52rem;
      border-radius: 0;
      letter-spacing: .02em;
    }

    /* ── Action buttons row ── */
    #modal-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .45rem;
      margin-bottom: .6rem;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .2rem;
      padding: .6rem .3rem;
      background: #111;
      border: 1px solid #252525;
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: .7rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      border-radius: 0;
      transition: border-color .15s, background .15s, color .15s;
    }
    .action-btn .btn-icon { font-size: 1.05rem; line-height: 1; }
    .action-btn:hover, .action-btn.btn-active {
      border-color: #e00;
      background: #180000;
      color: #fff;
    }

    /* ── QR reveal panel ── */
    #qr-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height .3s ease, opacity .25s ease;
    }
    #qr-panel.open { max-height: 240px; opacity: 1; }
    #qr-panel-inner {
      padding-top: .65rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .45rem;
    }
    #modal-qr {
      background: #fff;
      padding: .5rem;
      border: 2px solid #fff;
      box-shadow: 4px 4px 0 rgba(220,0,0,.2);
    }
    #modal-qr-img { display: block; width: 150px; height: 150px; }
    #modal-hint {
      font-size: .66rem;
      color: #444;
      text-align: center;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Info + QR Modal -->
<div id="modal-overlay">
  <div id="modal-card">
    <div id="modal-stripe"></div>

    <!-- Image (fixed, non-scrolling) -->
    <div id="modal-img-wrap">
      <img id="modal-img" src="" alt="" loading="lazy" />
      <button id="modal-close" aria-label="Schließen">✕</button>
    </div>

    <!-- Scrollable content -->
    <div id="modal-body">
      <div id="modal-label">
        <span id="modal-emoji"></span>
        <span id="modal-name"></span>
      </div>
      <p id="modal-desc"></p>
      <div id="modal-highlights"></div>

      <div id="modal-actions">
        <a id="btn-website" href="#" target="_blank" rel="noopener" class="action-btn">
          <span class="btn-icon">🔗</span><span>Website</span>
        </a>
        <button id="btn-qr" class="action-btn" type="button">
          <span class="btn-icon">📱</span><span>QR Code</span>
        </button>
        <a id="btn-transit" href="#" target="_blank" rel="noopener" class="action-btn">
          <span class="btn-icon">🚌</span><span>Verbindung</span>
        </a>
      </div>

      <div id="qr-panel">
        <div id="qr-panel-inner">
          <div id="modal-qr">
            <img id="modal-qr-img" src="" alt="QR Code" width="150" height="150" />
          </div>
          <div id="modal-hint">Scannen zum Öffnen</div>
        </div>
      </div>
    </div><!-- /modal-body -->
  </div><!-- /modal-card -->
</div><!-- /modal-overlay -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  'use strict';

  /* Airbnb coords – used as transit origin for all other locations */
  var ABB_LAT = 50.9250, ABB_LNG = 6.9530;

  /* ── Map ── */
  var map = L.map('map', {
    center: [50.9340, 6.9495],
    zoom: 13,
    zoomControl: true,
    scrollWheelZoom: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  /* ── Location data ── */
  var locations = [
    {
      lat: 50.9431, lng: 6.9591,
      emoji: '🚆',
      name: 'Köln Hauptbahnhof',
      img: 'https://picsum.photos/seed/koeln-hbf/480/200',
      desc: 'Kölns zentraler Bahnhof – direkt vor der Tür der mächtige Kölner Dom. Hier startet das Abenteuer.',
      highlights: ['🏛️ Dom nebenan', '🚇 ICE & S-Bahn', '🚶 5 Min zur Altstadt'],
      url: 'https://www.google.com/maps/search/?api=1&query=K%C3%B6ln+Hauptbahnhof',
      isAirbnb: false
    },
    {
      lat: ABB_LAT, lng: ABB_LNG,
      emoji: '🏠',
      name: 'Airbnb – Unsere Base',
      img: 'https://picsum.photos/seed/airbnb-kln/480/200',
      desc: 'Unsere Unterkunft für den Köln-Trip. Check-in Freitag, Check-out Sonntag. Koffer fallen lassen!',
      highlights: ['📅 08.–10. Mai 2026', '👥 3 Personen', '🔑 Check-in beachten'],
      url: 'https://www.airbnb.de/rooms/5391364?adults=3&check_in=2026-05-08&check_out=2026-05-10&search_mode=regular_search&source_impression_id=p3_1772967829_P3S7Fhy1sKy-w9mB&previous_page_section_name=1000&federated_search_id=e9e9c140-ab87-4551-88ce-815df4cd55ca',
      isAirbnb: true
    },
    {
      lat: 50.9441, lng: 6.9459,
      emoji: '🍺',
      name: 'Päffgen Friesenstraße',
      img: 'https://picsum.photos/seed/paeffgen/480/200',
      desc: 'Eine der ältesten Brauereigaststätten Kölns. Kölsch direkt vom Fass, rustikales Flair – immer belebt.',
      highlights: ['🍺 Kölsch vom Fass', '⏰ ab 11 Uhr', '📍 Friesenstr. 64–66'],
      url: 'https://www.google.com/maps/search/?api=1&query=P%C3%A4ffgen+Friesenstra%C3%9Fe+K%C3%B6ln',
      isAirbnb: false
    },
    {
      lat: 50.9512, lng: 6.9196,
      emoji: '👗',
      name: 'Ehrenfeld – Venloer Str.',
      img: 'https://picsum.photos/seed/ehrenfeld/480/200',
      desc: 'Kölns Kreativviertel mit Streetart, unabhängigen Shops und dem besten Secondhand-Angebot der Stadt.',
      highlights: ['🎨 Streetart überall', '🧥 Top Vintage-Shops', '🚇 KVB Linie 3 / 4'],
      url: 'https://www.google.com/maps/search/?api=1&query=Venloer+Stra%C3%9Fe+Ehrenfeld+K%C3%B6ln',
      isAirbnb: false
    },
    {
      lat: 50.9249, lng: 6.9538,
      emoji: '🍖',
      name: 'trashxchic',
      img: 'https://picsum.photos/seed/trashxchic/480/200',
      desc: 'Hier essen, trinken und abhängen – ab 17 Uhr gibt\'s Gyros und gute Vibes. Genau das Richtige nach dem Shopping.',
      highlights: ['🥙 Gyros & mehr', '⏰ 17:00–22:00 Uhr', '📸 @trashxchic'],
      url: 'https://www.instagram.com/trashxchic?igsh=anFoMTU1dzNna2oz',
      isAirbnb: false
    },
    {
      lat: 50.9389, lng: 6.9337,
      emoji: '🎸',
      name: 'Kantine Köln',
      img: 'https://picsum.photos/seed/kantine-punk/480/200',
      desc: 'Das Highlight des Trips – Pothead live! Ska-Punk at its finest in einer der besten Locations der Stadt.',
      highlights: ['🎸 Pothead live!', '📍 Aachener Str. 2', '🚋 Haltestelle Rudolfplatz'],
      url: 'https://www.kantine.de',
      isAirbnb: false
    },
    {
      lat: 50.9212, lng: 6.9503,
      emoji: '🌳',
      name: 'Volksgarten',
      img: 'https://picsum.photos/seed/volksgarten/480/200',
      desc: 'Kölns grüne Oase in der Südstadt – ideal zum Abschalten, Spazieren oder für einen ruhigen Sonntagmorgen.',
      highlights: ['🌿 Großer Stadtpark', '🏞️ Teich & Wege', '🧘 Ruhe & Natur'],
      url: 'https://www.google.com/maps/search/?api=1&query=Volksgarten+K%C3%B6ln',
      isAirbnb: false
    },
    /* ── Secondhand / Shops ── */
    {
      lat: 50.9370, lng: 6.9985,
      emoji: '♻️',
      name: 'fairstore Kalk – Diakonie',
      img: 'https://picsum.photos/seed/fairstore-kalk/480/200',
      desc: 'Soziales Kaufhaus der Diakonie Michaelshoven. Gut erhaltene Kleidung, Möbel, Bücher & Haushalt zu fairen Preisen. Menschen mit geringem Einkommen erhalten bis zu 30 % Rabatt.',
      highlights: ['♻️ Secondhand & Spenden', '💚 Soziales Kaufhaus', '🏷️ Bis –30 % für Geringverdiener', '⏰ Mo–Fr 10–18 · Sa 10–15', '📍 Kalker Hauptstr. 177'],
      url: 'https://www.diakonie-michaelshoven.de',
      isAirbnb: false
    },
    {
      lat: 50.9458, lng: 6.9592,
      emoji: '🖼️',
      name: 'ARC Store Gallery',
      img: 'https://picsum.photos/seed/arc-store/480/200',
      desc: 'Vintage, Second Hand & Outlet mit Galerie-Flair. Textilien, Möbel, Fahrräder und vieles mehr – direkt auf der Eigelstein nahe HBF.',
      highlights: ['🧥 Vintage & Second Hand', '🚲 Möbel & Fahrräder', '🖼️ Gallery-Space', '⏰ Mo–Sa 12–17 Uhr', '📍 Eigelstein 23'],
      url: 'https://www.instagram.com/arc_store_gallery/',
      isAirbnb: false
    },
    /* ── Vegane Restaurants & Cafés ── */
    {
      lat: 50.9204, lng: 6.9533,
      emoji: '🌱',
      name: 'Chickpea Köln',
      img: 'https://picsum.photos/seed/chickpea-kln/480/200',
      desc: 'Veganes Restaurant in der Südstadt – orientalisch-mediterrane Küche, frische Bowls und Mezze. Sehr beliebt, kommt früh!',
      highlights: ['🌱 100 % VEGAN', '🥙 Bowls & Mezze', '📍 Südstadt / Chlodwigplatz'],
      url: 'https://www.google.com/maps/search/?api=1&query=Chickpea+vegan+K%C3%B6ln',
      isAirbnb: false
    },
    {
      lat: 50.9495, lng: 6.9228,
      emoji: '🌱',
      name: 'ExtraGrün',
      img: 'https://picsum.photos/seed/extragruen/480/200',
      desc: 'Veganes Restaurant in Ehrenfeld mit wechselndem Tagesmenü, saisonaler Küche und gemütlicher Atmosphäre.',
      highlights: ['🌱 100 % VEGAN', '🍽️ Saisonale Küche', '📍 Ehrenfeld'],
      url: 'https://www.google.com/maps/search/?api=1&query=ExtraGr%C3%BCn+vegan+K%C3%B6ln+Ehrenfeld',
      isAirbnb: false
    },
    {
      lat: 50.9390, lng: 6.9472,
      emoji: '🌱',
      name: 'Loving Hut Köln',
      img: 'https://picsum.photos/seed/lovinghut-kln/480/200',
      desc: 'Internationale vegane Küche mitten in der Stadt. Günstiges Mittagsmenü, asiatische Gerichte und Smoothies.',
      highlights: ['🌱 100 % VEGAN', '🍜 Asiatisch & international', '💶 Günstiges Mittagsmenü', '📍 Innenstadt'],
      url: 'https://www.google.com/maps/search/?api=1&query=Loving+Hut+K%C3%B6ln',
      isAirbnb: false
    },
    /* ── Supermärkte nahe Airbnb ── */
    {
      lat: 50.9187, lng: 6.9543,
      emoji: '🛒',
      name: 'REWE Südstadt',
      img: 'https://picsum.photos/seed/rewe-sued/480/200',
      desc: 'Großer REWE fußläufig vom Airbnb – breites Sortiment, Backshop und lange Öffnungszeiten.',
      highlights: ['🛒 Vollsortimenter', '🥖 Backshop', '⏰ Mo–Sa 7–22 Uhr', '📍 Nähe Chlodwigplatz'],
      url: 'https://www.google.com/maps/search/?api=1&query=REWE+K%C3%B6ln+S%C3%BCdstadt',
      isAirbnb: false
    },
    {
      lat: 50.9242, lng: 6.9508,
      emoji: '🛒',
      name: 'Penny Südstadt',
      img: 'https://picsum.photos/seed/penny-sued/480/200',
      desc: 'Penny-Discounter direkt in der Nähe der Unterkunft – günstig einkaufen für Frühstück & Snacks.',
      highlights: ['🛒 Discounter', '💶 Günstig', '⏰ Mo–Sa 7–22 Uhr', '📍 Südstadt'],
      url: 'https://www.google.com/maps/search/?api=1&query=Penny+K%C3%B6ln+S%C3%BCdstadt',
      isAirbnb: false
    },
    {
      lat: 50.9268, lng: 6.9482,
      emoji: '🛒',
      name: 'Netto Südstadt',
      img: 'https://picsum.photos/seed/netto-sued/480/200',
      desc: 'Netto Marken-Discount in wenigen Minuten vom Airbnb erreichbar. Ideal für schnelle Einkäufe.',
      highlights: ['🛒 Discounter', '💶 Günstig', '⏰ Mo–Sa 7–21 Uhr', '📍 Südstadt'],
      url: 'https://www.google.com/maps/search/?api=1&query=Netto+K%C3%B6ln+S%C3%BCdstadt',
      isAirbnb: false
    }
  ];

  /* ── Build markers ── */
  var activeMarkerEl = null;

  locations.forEach(function (loc) {
    var iconEl = document.createElement('div');
    iconEl.className = 'map-pin';
    iconEl.textContent = loc.emoji;
    iconEl.title = loc.name;

    var icon = L.divIcon({
      html: iconEl.outerHTML,
      className: '',
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });

    var marker = L.marker([loc.lat, loc.lng], { icon: icon }).addTo(map);
    marker.on('click', function () { openModal(loc, marker.getElement()); });
  });

  /* ── Modal elements ── */
  var overlay    = document.getElementById('modal-overlay');
  var emojiEl    = document.getElementById('modal-emoji');
  var nameEl     = document.getElementById('modal-name');
  var descEl     = document.getElementById('modal-desc');
  var hlEl       = document.getElementById('modal-highlights');
  var imgEl      = document.getElementById('modal-img');
  var btnWebsite = document.getElementById('btn-website');
  var btnQr      = document.getElementById('btn-qr');
  var btnTransit = document.getElementById('btn-transit');
  var qrPanel    = document.getElementById('qr-panel');
  var qrImg      = document.getElementById('modal-qr-img');
  var modalBody  = document.getElementById('modal-body');

  function openModal(loc, markerEl) {
    /* Deactivate previous pin */
    if (activeMarkerEl) activeMarkerEl.querySelector('.map-pin').classList.remove('active');
    activeMarkerEl = markerEl;
    if (markerEl) markerEl.querySelector('.map-pin').classList.add('active');

    /* Reset QR state */
    qrPanel.classList.remove('open');
    btnQr.classList.remove('btn-active');
    qrImg.src = '';

    /* Fill content */
    emojiEl.textContent = loc.emoji;
    nameEl.textContent  = loc.name;
    descEl.textContent  = loc.desc;
    imgEl.src           = loc.img;
    imgEl.alt           = loc.name;

    hlEl.innerHTML = '';
    loc.highlights.forEach(function (h) {
      var tag = document.createElement('span');
      tag.className = 'hl-tag';
      tag.textContent = h;
      hlEl.appendChild(tag);
    });

    /* Website button */
    btnWebsite.href = loc.url;

    /* Transit button – from Airbnb to this location (or HBF→Airbnb for the Airbnb pin) */
    var origin, dest;
    if (loc.isAirbnb) {
      origin = '50.9431,6.9591'; /* HBF */
      dest   = ABB_LAT + ',' + ABB_LNG;
    } else {
      origin = ABB_LAT + ',' + ABB_LNG;
      dest   = loc.lat + ',' + loc.lng;
    }
    btnTransit.href = 'https://www.google.com/maps/dir/?api=1&origin=' + origin + '&destination=' + dest + '&travelmode=transit';

    /* Scroll to top and open */
    modalBody.scrollTop = 0;
    overlay.classList.add('open');
  }

  /* QR toggle (lazy-load) */
  btnQr.addEventListener('click', function () {
    var open = qrPanel.classList.toggle('open');
    btnQr.classList.toggle('btn-active', open);
    if (open && !qrImg.src.includes('qrserver')) {
      var encoded = encodeURIComponent(btnWebsite.href);
      qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encoded + '&color=0a0a0a&bgcolor=ffffff&margin=6';
    }
  });

  function closeModal() {
    overlay.classList.remove('open');
    if (activeMarkerEl) activeMarkerEl.querySelector('.map-pin').classList.remove('active');
    activeMarkerEl = null;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

})();
</script>
</body>
</html>
